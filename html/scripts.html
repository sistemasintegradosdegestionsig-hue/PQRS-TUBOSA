<script>

/* =====================================================
   PQRS TUBOSA
   Scripts Principales
===================================================== */

document.addEventListener("DOMContentLoaded", iniciarSistema);

/**
 * Inicializa el sistema
 */
function iniciarSistema(){

    console.log("Sistema PQRS iniciado");

    registrarEventos();

}

/**
 * Registra eventos de botones
 */
function registrarEventos(){

    const btnNueva = document.getElementById("btnNueva");

    if(btnNueva){

        btnNueva.addEventListener("click", abrirFormulario);

    }

}

/**
 * Abrir formulario de PQRS
 */
function abrirFormulario(){

    alert("En la siguiente fase se abrirá el formulario de registro de PQRS.");

}

/**
 * Mostrar mensaje
 */
function mostrarMensaje(mensaje){

    alert(mensaje);

}

/**
 * Mostrar carga
 */
function mostrarCarga(){

    console.log("Cargando...");

}

/**
 * Ocultar carga
 */
function ocultarCarga(){

    console.log("Proceso terminado.");

}

</script>
