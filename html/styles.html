<style>

/* ===========================================
   PQRS TUBOSA
   Estilos Generales
=========================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family: "Segoe UI", Arial, sans-serif;
    background:#F4F6F9;
    color:#333;
    min-height:100vh;

}

/* Contenedor principal */

.container{

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;

}

/* Tarjeta */

.card{

    width:550px;
    background:#FFFFFF;
    border-radius:15px;
    padding:40px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    text-align:center;

}

/* Logo */

.logo{

    width:90px;
    margin:auto;
    margin-bottom:20px;

}

/* Título */

h1{

    color:#0052CC;
    margin-bottom:10px;
    font-size:32px;

}

h2{

    color:#444;
    margin-bottom:20px;

}

/* Texto */

p{

    color:#666;
    margin-bottom:25px;
    line-height:1.6;

}

/* Botón */

button{

    width:100%;
    background:#0052CC;
    color:white;
    border:none;
    padding:15px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;

}

button:hover{

    background:#003E99;

}

/* Inputs */

input,
select,
textarea{

    width:100%;
    padding:12px;
    border:1px solid #D8D8D8;
    border-radius:8px;
    margin-bottom:15px;
    font-size:15px;

}

input:focus,
select:focus,
textarea:focus{

    outline:none;
    border:1px solid #0052CC;

}

/* Responsive */

@media(max-width:768px){

.card{

    width:100%;
    padding:25px;

}

h1{

    font-size:26px;

}

}

</style>
.secondary{

    background:white;
    color:#0052CC;
    border:2px solid #0052CC;
    margin-top:15px;

}

.secondary:hover{

    background:#0052CC;
    color:white;

}
